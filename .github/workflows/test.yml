name: Tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The SQL schemas live in the memogarden/memogarden submodule (pinned
      # to schema-release tags) — get_sql_schema() resolves through it, so
      # tests cannot even import the conftest without it. memogarden/
      # memogarden is public, so the default token clones it. Init must be
      # explicit and path-scoped: actions/checkout's submodules input is
      # always --recursive, and the schemas repo carries unregistered
      # gitlinks (app-budget, hacm, mars, ...) that break recursion.
      - name: Init schemas submodule
        run: git submodule update --init system/schemas/memogarden

      # poetry path dependency: memogarden-utils = {path = "../memogarden-utils"}.
      # checkout places it under $GITHUB_WORKSPACE (the repo dir); move it up
      # one level so ../memogarden-utils resolves.
      - name: Checkout memogarden-utils sibling
        uses: actions/checkout@v4
        with:
          repository: memogarden/memogarden-utils
          path: memogarden-utils

      - name: Position memogarden-utils as sibling
        run: mv "$GITHUB_WORKSPACE/memogarden-utils" "$GITHUB_WORKSPACE/../memogarden-utils"

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'poetry'

      - name: Install dependencies
        run: poetry install --with dev

      - name: Run tests
        run: poetry run pytest --tb=short -q

      - name: Test Summary
        if: always()
        run: |
          echo "### Test Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ All tests passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Tests failed" >> $GITHUB_STEP_SUMMARY
          fi
